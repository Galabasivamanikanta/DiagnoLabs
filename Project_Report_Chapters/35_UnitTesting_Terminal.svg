<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="850" height="420">
    <!-- Background -->
    <rect width="850" height="420" rx="10" ry="10" fill="#1e1e1e"/>
    
    <!-- Terminal Header (Mac style buttons) -->
    <rect width="850" height="35" fill="#323233" rx="10" ry="10"/>
    <rect y="20" width="850" height="15" fill="#323233"/>
    <circle cx="20" cy="17" r="6" fill="#ff5f56"/>
    <circle cx="40" cy="17" r="6" fill="#ffbd2e"/>
    <circle cx="60" cy="17" r="6" fill="#27c93f"/>
    <text x="425" y="22" font-family="sans-serif" font-size="12" fill="#969696" text-anchor="middle">bash - node</text>

    <!-- Main Terminal Text -->
    <g font-family="Consolas, 'Courier New', monospace" font-size="14">
        <text x="20" y="70" fill="#d4d4d4">$ npm run test tests/haversine.test.js</text>
        <text x="20" y="95" fill="#d4d4d4">&gt; diagnolabs-backend@1.0.0 test</text>
        <text x="20" y="115" fill="#d4d4d4">&gt; jest tests/haversine.test.js</text>
        
        <!-- PASS Badge -->
        <rect x="20" y="140" width="46" height="22" fill="#27c93f" rx="3"/>
        <text x="25" y="156" fill="#1e1e1e" font-weight="bold">PASS</text>
        <text x="75" y="156" fill="#d4d4d4">tests/haversine.test.js</text>
        
        <text x="20" y="185" fill="#d4d4d4">  Haversine Geospatial Algorithm</text>
        <text x="20" y="210" fill="#27c93f">    √ <tspan fill="#d4d4d4">should calculate distance between two identical coordinates as 0 km</tspan> <tspan fill="#969696">(4 ms)</tspan></text>
        <text x="20" y="235" fill="#27c93f">    √ <tspan fill="#d4d4d4">should calculate accurate distance between Hyderabad and Bangalore</tspan> <tspan fill="#969696">(2 ms)</tspan></text>
        <text x="20" y="260" fill="#27c93f">    √ <tspan fill="#d4d4d4">should return distance within 0.1% margin of error for known coords</tspan> <tspan fill="#969696">(1 ms)</tspan></text>
        <text x="20" y="285" fill="#27c93f">    √ <tspan fill="#d4d4d4">should handle negative coordinates correctly</tspan> <tspan fill="#969696">(1 ms)</tspan></text>
        <text x="20" y="310" fill="#27c93f">    √ <tspan fill="#d4d4d4">should throw an error if latitude is out of bounds</tspan> <tspan fill="#969696">(2 ms)</tspan></text>

        <text x="20" y="345" fill="#d4d4d4" font-weight="bold">Test Suites: <tspan fill="#27c93f">1 passed</tspan>, 1 total</text>
        <text x="20" y="365" fill="#d4d4d4" font-weight="bold">Tests:       <tspan fill="#27c93f">5 passed</tspan>, 5 total</text>
        <text x="20" y="385" fill="#d4d4d4" font-weight="bold">Snapshots:   <tspan fill="#d4d4d4">0 total</tspan></text>
        <text x="20" y="405" fill="#d4d4d4" font-weight="bold">Time:        <tspan fill="#d4d4d4">0.428 s</tspan></text>
    </g>
</svg>
